spring.application.name=comercial-api
spring.datasource.url=jdbc:postgresql://${PG_HOST}:${PG_PORT}/db_gestao_comercial
spring.datasource.username=${PG_USER}
spring.datasource.password=${PG_PASSWORD}
spring.jpa.properties.hibernate.default_schema=portfolio_web
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.default-schema=portfolio_web
spring.flyway.schemas=portfolio_web
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
